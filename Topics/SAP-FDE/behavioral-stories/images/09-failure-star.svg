<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="STAR scaffold for a failure/learning story — instance to be chosen">
  <rect x="0" y="0" width="640" height="512" fill="#ffffff"/>
  <defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <text x="30" y="32" font-size="18" font-weight="700" fill="#0f172a">Story 09 · A bet that underperformed — STAR (SCAFFOLD)</text>

  <rect x="40" y="48" width="560" height="62" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="56" y="70" font-size="13" font-weight="700" fill="#1E4E79">S · Situation</text>
  <text x="56" y="90" font-size="12" fill="#33587D">[FILL IN] The context and the bet you made — the surface, the stakes,</text>
  <text x="56" y="105" font-size="12" fill="#33587D">and what you EXPECTED to happen.</text>
  <line x1="320" y1="110" x2="320" y2="130" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <rect x="40" y="132" width="560" height="52" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="56" y="154" font-size="13" font-weight="700" fill="#1E4E79">T · Task</text>
  <text x="56" y="173" font-size="12" fill="#33587D">[FILL IN] What you owned and what "success" was supposed to look like.</text>
  <line x1="320" y1="184" x2="320" y2="204" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <rect x="40" y="206" width="560" height="90" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="56" y="228" font-size="13" font-weight="700" fill="#0F5C46">A · Action (what I did — own it plainly)</text>
  <text x="56" y="248" font-size="12" fill="#12735A">[FILL IN] The bet I made and why it was reasonable at the time.</text>
  <text x="56" y="264" font-size="12" fill="#12735A">[FILL IN] How I honestly caught it was underperforming (a real signal).</text>
  <text x="56" y="280" font-size="12" fill="#12735A">[FILL IN] What I CHANGED + the guardrail so it can't recur (the bulk).</text>
  <line x1="320" y1="296" x2="320" y2="316" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <rect x="40" y="318" width="560" height="72" rx="10" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="56" y="340" font-size="13" font-weight="700" fill="#6B4A16">R · Result</text>
  <text x="56" y="360" font-size="12" fill="#8A6320">[FILL IN] One honest number: the bet cost / underperformed by [X].</text>
  <text x="56" y="376" font-size="12" fill="#8A6320">Then: what the pivot recovered/avoided + the durable lesson.</text>

  <text x="30" y="420" font-size="12" font-weight="700" fill="#334155">Signals: ownership of failure · learning &amp; adaptation · data honesty</text>

  <rect x="40" y="434" width="560" height="58" rx="10" fill="#FCEBE7" stroke="#DC4A34"/>
  <text x="56" y="456" font-size="12" font-weight="700" fill="#DC4A34">PICK A REAL INSTANCE — do NOT invent a failure.</text>
  <text x="56" y="474" font-size="11" fill="#B33B29">Choose ONE: (a) a losing checkout variant · (b) a wrong migration assumption</text>
  <text x="56" y="488" font-size="11" fill="#B33B29">· (c) a gap a production incident exposed. Every specific here is a placeholder.</text>
</svg>
