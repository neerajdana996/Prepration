<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="STAR breakdown of the Cypress to Playwright migration story">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>
  <defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <text x="30" y="32" font-size="18" font-weight="700" fill="#0f172a">Story 04 · Cypress → Playwright (Atlassian) — STAR</text>

  <rect x="40" y="48" width="560" height="62" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="56" y="70" font-size="13" font-weight="700" fill="#1E4E79">S · Situation</text>
  <text x="56" y="90" font-size="12" fill="#33587D">The commerce E2E suite (Cypress) had been flaky for 8 MONTHS — the shared</text>
  <text x="56" y="105" font-size="12" fill="#33587D">Pollinator pipeline threw intermittent failures. Nobody clearly owned the fix.</text>
  <line x1="320" y1="110" x2="320" y2="130" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <rect x="40" y="132" width="560" height="52" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="56" y="154" font-size="13" font-weight="700" fill="#1E4E79">T · Task</text>
  <text x="56" y="173" font-size="12" fill="#33587D">Own it: drive the migration AND actually kill the flakiness, across teams.</text>
  <line x1="320" y1="184" x2="320" y2="204" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <rect x="40" y="206" width="560" height="78" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="56" y="228" font-size="13" font-weight="700" fill="#0F5C46">A · Action (what I did)</text>
  <text x="56" y="248" font-size="12" fill="#12735A">Audited 8 MONTHS of Pollinator failures → classified root causes by category.</text>
  <text x="56" y="264" font-size="12" fill="#12735A">Drove the migration to Playwright, fixing causes at the source (not porting them).</text>
  <text x="56" y="280" font-size="12" fill="#12735A">Coordinated CROSS-TEAM fixes with categorized evidence, not anecdotes.</text>
  <line x1="320" y1="284" x2="320" y2="304" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <rect x="40" y="306" width="560" height="72" rx="10" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="56" y="328" font-size="13" font-weight="700" fill="#6B4A16">R · Result</text>
  <text x="56" y="348" font-size="12" fill="#8A6320">Cut flaky-test rate by 80% and raised deployment confidence — green meant green.</text>
  <text x="56" y="364" font-size="12" fill="#8A6320">Lesson: audit real failure data, classify, fix the source — not the symptom.</text>

  <text x="30" y="410" font-size="12" font-weight="700" fill="#334155">Signals: initiative · data-driven root-cause · ownership · cross-team · quality bar</text>
  <text x="30" y="432" font-size="11" fill="#DC4A34">Root-cause categories &amp; coordination mechanism are placeholders — fill in before using.</text>
</svg>
