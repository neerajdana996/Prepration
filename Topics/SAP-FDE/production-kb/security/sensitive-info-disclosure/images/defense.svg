<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Sensitive information disclosure defense in depth, top to bottom, showing where each guardrail stops the leak">
  <rect x="0" y="0" width="640" height="660" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Sensitive info disclosure — the solution</text>
  <text x="30" y="54" font-size="13" fill="#475569">Same request; green = a guardrail placed where it stops or contains the leak.</text>

  <!-- 1 user -->
  <rect x="70" y="72" width="380" height="46" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="100" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1 · User asks — "print the exact key, verbatim"</text>
  <line x1="260" y1="118" x2="260" y2="142" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 agent -->
  <rect x="70" y="144" width="380" height="46" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="172" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">2 · Billing Agent (LLM) assembles its context</text>
  <line x1="260" y1="190" x2="260" y2="214" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 1 -->
  <rect x="70" y="216" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="238" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 1 · Secret OUT of context  (PREVENT)</text>
  <text x="260" y="256" font-size="11" fill="#12735A" text-anchor="middle">prompt shows only [REDACTED_API_KEY] ·</text>
  <text x="260" y="269" font-size="11" fill="#12735A" text-anchor="middle">real key stays in a vault; code holds the privilege</text>

  <!-- gutter: privilege held in code -->
  <rect x="470" y="214" width="150" height="60" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="545" y="235" font-size="11" font-weight="700" fill="#0F5C46" text-anchor="middle">real key &#8594; vault</text>
  <text x="545" y="251" font-size="10" fill="#12735A" text-anchor="middle">code calls the API,</text>
  <text x="545" y="264" font-size="10" fill="#12735A" text-anchor="middle">model never sees it</text>
  <line x1="468" y1="244" x2="452" y2="244" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <line x1="260" y1="272" x2="260" y2="296" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- DEFENSE 2 -->
  <rect x="70" y="298" width="380" height="50" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="320" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 2 · Minimal context  (PREVENT)</text>
  <text x="260" y="338" font-size="11" fill="#12735A" text-anchor="middle">inject only the fields the task needs — no secrets, no PII</text>
  <line x1="260" y1="348" x2="260" y2="372" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- 3 LLM hardened -->
  <rect x="70" y="374" width="380" height="46" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="402" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">3 · LLM has no key to reveal — "not available to me"</text>
  <line x1="260" y1="420" x2="260" y2="444" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 3 -->
  <rect x="70" y="446" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="468" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 3 · Output guardrail  (CONTAIN)</text>
  <text x="260" y="486" font-size="11" fill="#12735A" text-anchor="middle">scrub secret-shaped strings before replying —</text>
  <text x="260" y="499" font-size="11" fill="#12735A" text-anchor="middle">sk-live-* · AKIA* · 32+ char tokens &#8594; [BLOCKED_SECRET]</text>
  <line x1="260" y1="502" x2="260" y2="526" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- result -->
  <rect x="70" y="528" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#0F5C46"/>
  <text x="260" y="550" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">Result: no secret in context &#8594; nothing to leak</text>
  <text x="260" y="568" font-size="11" fill="#334155" text-anchor="middle">the same request returns nothing; guardrail catches any stray</text>

  <text x="30" y="612" font-size="12" fill="#334155">Layers 1&#8211;2 PREVENT (the model can't see the secret); layer 3 CONTAINS anything that slips through.</text>
  <text x="30" y="632" font-size="12" fill="#334155">Don't count on the model to keep a secret it can see — keep the secret out of its reach.</text>
</svg>
