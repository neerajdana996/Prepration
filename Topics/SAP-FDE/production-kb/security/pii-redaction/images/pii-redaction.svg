<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="system-ui, sans-serif" role="img" aria-label="PII redaction before the model and before logs">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#1a1a1a">PII redaction: strip sensitive data before the model AND before logs</text>

  <rect x="24" y="44" width="632" height="46" rx="8" fill="#EEEDE8" stroke="#B4B2A9"/>
  <text x="40" y="66" font-size="12" fill="#333">PRINCIPLE: the prompt is not private. Once PII is in the prompt it can be stored in provider logs or</text>
  <text x="40" y="82" font-size="12" fill="#333">surface in another session. Enforce in code — "don't repeat the SSN" is a preference, not a control.</text>

  <!-- raw input -->
  <rect x="24" y="108" width="150" height="72" rx="8" fill="#FAE4DC" stroke="#D85A30"/>
  <text x="99" y="130" font-size="12" font-weight="700" fill="#5A2413" text-anchor="middle">RAW INPUT</text>
  <text x="99" y="148" font-size="11" fill="#5A2413" text-anchor="middle">email, phone,</text>
  <text x="99" y="163" font-size="11" fill="#5A2413" text-anchor="middle">card, secrets</text>

  <!-- redact guard -->
  <rect x="214" y="108" width="180" height="72" rx="8" fill="#FAECD9" stroke="#D89B4A"/>
  <text x="304" y="130" font-size="12" font-weight="700" fill="#5A3A12" text-anchor="middle">REDACT() guard</text>
  <text x="304" y="148" font-size="11" fill="#5A3A12" text-anchor="middle">detect: regex + NER</text>
  <text x="304" y="163" font-size="11" fill="#5A3A12" text-anchor="middle">mask OR tokenize</text>

  <!-- model -->
  <rect x="434" y="108" width="100" height="72" rx="8" fill="#DCE9DA" stroke="#5A9A52"/>
  <text x="484" y="140" font-size="12" font-weight="700" fill="#1E4A1A" text-anchor="middle">MODEL</text>
  <text x="484" y="158" font-size="11" fill="#1E4A1A" text-anchor="middle">masked text</text>

  <!-- logs -->
  <rect x="434" y="200" width="100" height="60" rx="8" fill="#DCE9DA" stroke="#5A9A52"/>
  <text x="484" y="228" font-size="12" font-weight="700" fill="#1E4A1A" text-anchor="middle">LOGS</text>
  <text x="484" y="246" font-size="11" fill="#1E4A1A" text-anchor="middle">masked text</text>

  <!-- arrows -->
  <line x1="174" y1="144" x2="212" y2="144" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <line x1="394" y1="144" x2="432" y2="144" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <line x1="304" y1="180" x2="304" y2="230" stroke="#666" stroke-width="2"/>
  <line x1="304" y1="230" x2="432" y2="230" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="222" font-size="10" fill="#666">same guard before logs</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <text x="24" y="285" font-size="12" fill="#555">Pair with role-scoped retrieval (users pull only what they're entitled to) + data residency (keep EU data in-region).</text>
</svg>
