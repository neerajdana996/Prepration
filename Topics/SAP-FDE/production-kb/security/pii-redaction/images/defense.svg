<svg xmlns="http://www.w3.org/2000/svg" width="640" height="712" viewBox="0 0 640 712" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="PII redaction defense in depth, top to bottom, showing where each guardrail stops or contains the leak">
  <rect x="0" y="0" width="640" height="712" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">PII redaction — the solution (defense in depth)</text>
  <text x="30" y="54" font-size="13" fill="#475569">Same pipeline; green = a guardrail placed where it stops or contains the leak.</text>

  <!-- 1 ticket + raw PII still in record -->
  <rect x="70" y="72" width="380" height="46" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="260" y="100" font-size="13" font-weight="600" fill="#1E4E79" text-anchor="middle">1 · Support ticket retrieved  (raw PII in record)</text>
  <rect x="470" y="70" width="150" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="91" font-size="11" font-weight="700" fill="#7A2418" text-anchor="middle">RAW PII</text>
  <text x="545" y="107" font-size="10" fill="#93341F" text-anchor="middle">still in record</text>
  <line x1="468" y1="95" x2="452" y2="95" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>
  <line x1="260" y1="118" x2="260" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 1 -->
  <rect x="70" y="142" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="164" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 1 · redact() before the model  (PREVENT)</text>
  <text x="260" y="182" font-size="11" fill="#12735A" text-anchor="middle">regex + NER mask email/phone/card &#8594; [REDACTED_*]</text>
  <text x="260" y="195" font-size="11" fill="#12735A" text-anchor="middle">done ONCE, up front — before the prompt is built</text>
  <line x1="260" y1="198" x2="260" y2="220" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- 2 prompt masked -->
  <rect x="70" y="222" width="380" height="46" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="250" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">2 · Prompt holds only masked text</text>
  <line x1="260" y1="268" x2="260" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 3 model provider masked -->
  <rect x="70" y="292" width="380" height="46" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="320" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">3 · Model provider sees only masked text</text>
  <line x1="260" y1="338" x2="260" y2="360" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 2 -->
  <rect x="70" y="362" width="380" height="52" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="384" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 2 · redact() before logging  (PREVENT)</text>
  <text x="260" y="402" font-size="11" fill="#12735A" text-anchor="middle">same guard on the log path — traces are regulated data too</text>
  <line x1="260" y1="414" x2="260" y2="436" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- 4 logs masked -->
  <rect x="70" y="438" width="380" height="46" rx="10" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="260" y="466" font-size="13" font-weight="600" fill="#6B4A16" text-anchor="middle">4 · Logs / traces hold only masked text</text>
  <line x1="260" y1="484" x2="260" y2="506" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 3 -->
  <rect x="70" y="508" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="530" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 3 · role-scoped retrieval  (CONTAIN)</text>
  <text x="260" y="548" font-size="11" fill="#12735A" text-anchor="middle">user pulls only data they're entitled to · EU personal data</text>
  <text x="260" y="561" font-size="11" fill="#12735A" text-anchor="middle">stays on EU-region infrastructure</text>
  <line x1="260" y1="564" x2="260" y2="586" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- result -->
  <rect x="70" y="588" width="380" height="52" rx="10" fill="#EEF2F7" stroke="#0F5C46"/>
  <text x="260" y="610" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">Result: model + logs see only masked text</text>
  <text x="260" y="628" font-size="11" fill="#334155" text-anchor="middle">no raw PII crosses either boundary — both leaks closed</text>

  <text x="30" y="672" font-size="12" fill="#334155">PREVENT: redact before the model and before logs. CONTAIN: least-privilege retrieval, EU data residency.</text>
</svg>
