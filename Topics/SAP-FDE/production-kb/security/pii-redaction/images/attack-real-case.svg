<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="PII leak path, top to bottom, showing where customer data crosses the trust boundary">
  <rect x="0" y="0" width="640" height="660" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC4A34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">PII redaction — the leak path</text>
  <text x="30" y="54" font-size="13" fill="#475569">Where does customer PII cross the trust boundary?  (red = the leak path)</text>

  <!-- step 1 + PII source in gutter -->
  <rect x="70" y="76" width="380" height="50" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="260" y="98" font-size="13" font-weight="600" fill="#1E4E79" text-anchor="middle">1 · Support ticket retrieved</text>
  <text x="260" y="116" font-size="11" fill="#3B6EA0" text-anchor="middle">Jane Doe · email · phone · card 4111 1111 1111 1111</text>

  <rect x="470" y="70" width="150" height="62" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="91" font-size="12" font-weight="700" fill="#7A2418" text-anchor="middle">RAW PII</text>
  <text x="545" y="108" font-size="11" fill="#93341F" text-anchor="middle">= LEAK SOURCE</text>
  <text x="545" y="123" font-size="10" fill="#93341F" text-anchor="middle">(in the record itself)</text>
  <line x1="468" y1="101" x2="452" y2="101" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <line x1="260" y1="126" x2="260" y2="154" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 2 -->
  <rect x="70" y="156" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="178" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">2 · App pastes the raw record into the prompt</text>
  <text x="260" y="196" font-size="11" fill="#475569" text-anchor="middle">no redaction step — one string carries everything</text>
  <line x1="260" y1="206" x2="260" y2="234" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- FAILURE POINT A -->
  <rect x="70" y="236" width="380" height="46" rx="10" fill="#FBE3DE" stroke="#DC4A34" stroke-dasharray="5 3"/>
  <text x="260" y="257" font-size="13" font-weight="700" fill="#B23A22" text-anchor="middle">&#9888; FAILURE POINT A — leak to the model provider</text>
  <text x="260" y="274" font-size="11" fill="#93341F" text-anchor="middle">raw email/phone/card cross your trust boundary on the API call</text>
  <line x1="260" y1="282" x2="260" y2="310" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 3 model provider -->
  <rect x="70" y="312" width="380" height="50" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="334" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">3 · Model provider receives the raw PII</text>
  <text x="260" y="352" font-size="11" fill="#5B4FB0" text-anchor="middle">now retained in provider logs — outside your perimeter</text>
  <line x1="260" y1="362" x2="260" y2="390" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- FAILURE POINT B -->
  <rect x="70" y="392" width="380" height="46" rx="10" fill="#FBE3DE" stroke="#DC4A34" stroke-dasharray="5 3"/>
  <text x="260" y="413" font-size="13" font-weight="700" fill="#B23A22" text-anchor="middle">&#9888; FAILURE POINT B — leak to the logs</text>
  <text x="260" y="430" font-size="11" fill="#93341F" text-anchor="middle">the same raw prompt is print()ed straight into your traces</text>
  <line x1="260" y1="438" x2="260" y2="466" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 4 logs -->
  <rect x="70" y="468" width="380" height="50" rx="10" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="260" y="490" font-size="13" font-weight="600" fill="#6B4A16" text-anchor="middle">4 · Plaintext logs / traces store the PII</text>
  <text x="260" y="508" font-size="11" fill="#8A6320" text-anchor="middle">regulated personal data sitting in the clear</text>
  <line x1="260" y1="518" x2="260" y2="546" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 5 harm -->
  <rect x="70" y="548" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="260" y="570" font-size="13" font-weight="700" fill="#7A2418" text-anchor="middle">5 · PII exposed &#8594; GDPR breach  (harm)</text>
  <text x="260" y="588" font-size="11" fill="#93341F" text-anchor="middle">no attacker needed — the app leaks by design, in two places</text>

  <text x="30" y="632" font-size="12" fill="#334155">Takeaway: the DATA is the hazard — it leaks twice (provider + logs) before the model ever "decides".</text>
</svg>
