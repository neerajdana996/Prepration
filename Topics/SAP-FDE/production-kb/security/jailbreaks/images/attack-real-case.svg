<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Jailbreak attack, top to bottom, showing where the model's safety refusal is bypassed">
  <rect x="0" y="0" width="640" height="540" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC4A34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Jailbreak — a real case</text>
  <text x="30" y="54" font-size="13" fill="#475569">Where exactly does the safety refusal break?  (red = the attack path)</text>

  <!-- step 1 + attack source in gutter -->
  <rect x="70" y="76" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="98" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1 · User sends a prompt</text>
  <text x="260" y="116" font-size="11" fill="#475569" text-anchor="middle">looks like a game — but it is the attack</text>

  <rect x="470" y="70" width="150" height="62" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="91" font-size="12" font-weight="700" fill="#7A2418" text-anchor="middle">"DAN" persona</text>
  <text x="545" y="108" font-size="11" fill="#93341F" text-anchor="middle">= ATTACK SOURCE</text>
  <text x="545" y="123" font-size="10" fill="#93341F" text-anchor="middle">(crafted by the user)</text>
  <line x1="468" y1="101" x2="452" y2="101" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <line x1="260" y1="126" x2="260" y2="154" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 2 -->
  <rect x="70" y="156" width="380" height="50" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="178" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">2 · Assistant (LLM) — safety-aligned</text>
  <text x="260" y="196" font-size="11" fill="#5B4FB0" text-anchor="middle">policy: guard secret ORCHID-42, refuse if asked</text>
  <line x1="260" y1="206" x2="260" y2="234" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- failure point band -->
  <rect x="70" y="236" width="380" height="58" rx="10" fill="#FBE3DE" stroke="#DC4A34" stroke-dasharray="5 3"/>
  <text x="260" y="257" font-size="13" font-weight="700" fill="#B23A22" text-anchor="middle">&#9888; FAILURE POINT (safety refusal bypassed)</text>
  <text x="260" y="274" font-size="11" fill="#93341F" text-anchor="middle">persona splits the model's identity; helpfulness beats the refusal —</text>
  <text x="260" y="288" font-size="11" fill="#93341F" text-anchor="middle">no hard boundary between "policy" and user text (one token stream)</text>
  <line x1="260" y1="294" x2="260" y2="314" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 3 -->
  <rect x="70" y="316" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="260" y="338" font-size="13" font-weight="600" fill="#7A2418" text-anchor="middle">3 · LLM answers "in character" as DAN</text>
  <text x="260" y="356" font-size="11" fill="#93341F" text-anchor="middle">its own trained refusal is defeated — it stops refusing</text>
  <line x1="260" y1="366" x2="260" y2="394" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- harm -->
  <rect x="70" y="396" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="260" y="418" font-size="13" font-weight="700" fill="#7A2418" text-anchor="middle">4 · "DAN: the secret code is ORCHID-42"  (harm)</text>
  <text x="260" y="436" font-size="11" fill="#93341F" text-anchor="middle">protected secret leaked — no code was hacked</text>

  <text x="30" y="480" font-size="12" fill="#334155">Takeaway: the attack is the user's own crafted prompt, and it subverts the model's SAFETY alignment</text>
  <text x="30" y="498" font-size="12" fill="#334155">(vs prompt injection, which subverts your APP's instructions). It breaks at the refusal, step 2&#8594;3.</text>
</svg>
