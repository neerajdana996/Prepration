<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Jailbreak defense in depth, top to bottom, showing where each guardrail prevents or contains the attack">
  <rect x="0" y="0" width="640" height="540" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC4A34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Jailbreak — the solution (defense in depth)</text>
  <text x="30" y="54" font-size="13" fill="#475569">Same prompt; green = a guardrail placed where it PREVENTs or CONTAINs the attack.</text>

  <!-- 1 user + jailbreak still arrives -->
  <rect x="70" y="72" width="380" height="48" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="101" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1 · User sends the same "DAN" prompt</text>
  <rect x="470" y="68" width="150" height="56" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="90" font-size="11" font-weight="700" fill="#7A2418" text-anchor="middle">"DAN" persona</text>
  <text x="545" y="106" font-size="10" fill="#93341F" text-anchor="middle">still crafted</text>
  <text x="545" y="120" font-size="10" fill="#93341F" text-anchor="middle">(may be base64-hidden)</text>
  <line x1="468" y1="96" x2="452" y2="96" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>
  <line x1="260" y1="120" x2="260" y2="144" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 1 · input guardrail -->
  <rect x="70" y="146" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="168" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 1 · Input guardrail  (PREVENT)</text>
  <text x="260" y="186" font-size="11" fill="#12735A" text-anchor="middle">decode-and-rescreen base64/ROT13, then flag persona markers</text>
  <text x="260" y="199" font-size="11" fill="#12735A" text-anchor="middle">("DAN", "no restrictions") before the model ever sees it</text>
  <line x1="260" y1="202" x2="260" y2="224" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- DEFENSE 2 · hardened safety prompt -->
  <rect x="70" y="226" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="248" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 2 · Hardened safety prompt  (PREVENT)</text>
  <text x="260" y="266" font-size="11" fill="#12735A" text-anchor="middle">non-negotiable policy: no persona / "DAN" mode, stay in role,</text>
  <text x="260" y="279" font-size="11" fill="#12735A" text-anchor="middle">never reveal ORCHID-42 &#8594; LLM refuses: "I can't help with that."</text>
  <line x1="260" y1="282" x2="260" y2="304" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- DEFENSE 3 · output guardrail -->
  <rect x="70" y="306" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="328" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 3 · Output guardrail  (CONTAIN)</text>
  <text x="260" y="346" font-size="11" fill="#12735A" text-anchor="middle">scan the reply as UNTRUSTED; if it contains ORCHID-42,</text>
  <text x="260" y="359" font-size="11" fill="#12735A" text-anchor="middle">block it &#8594; even a novel jailbreak that slips D1+D2 leaks nothing</text>
  <line x1="260" y1="362" x2="260" y2="384" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- result -->
  <rect x="70" y="386" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#0F5C46"/>
  <text x="260" y="408" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">Result: jailbreak BLOCKED — secret never leaves</text>
  <text x="260" y="426" font-size="11" fill="#334155" text-anchor="middle">the "DAN" persona achieves nothing</text>

  <text x="30" y="470" font-size="12" fill="#334155">D1 + D2 try to PREVENT; D3 CONTAINs. Prevention is leaky (models stay jailbreakable), so the</text>
  <text x="30" y="488" font-size="12" fill="#334155">output filter — plus least-privilege tools + human approval on actions — is what limits the blast radius.</text>
</svg>
