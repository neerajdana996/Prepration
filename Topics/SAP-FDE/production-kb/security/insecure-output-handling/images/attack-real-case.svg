<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Insecure output handling attack, top to bottom, showing where untrusted LLM output becomes code">
  <rect x="0" y="0" width="640" height="660" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC4A34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Insecure output handling — a real case</text>
  <text x="30" y="54" font-size="13" fill="#475569">A "calculator" eval()s the model's reply.  (red = the attack path)</text>

  <!-- step 1 -->
  <rect x="70" y="76" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="98" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1 · User asks the calculator a question</text>
  <text x="260" y="116" font-size="11" fill="#475569" text-anchor="middle">but the prompt is attacker-influenceable</text>
  <line x1="260" y1="126" x2="260" y2="154" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- step 2 -->
  <rect x="70" y="156" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="178" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">2 · App builds the prompt to the model</text>
  <text x="260" y="196" font-size="11" fill="#475569" text-anchor="middle">"reply with ONLY an arithmetic expression"</text>
  <line x1="260" y1="206" x2="260" y2="234" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- step 3 + attack source in gutter -->
  <rect x="70" y="236" width="380" height="50" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="258" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">3 · Calculator LLM emits its reply</text>
  <text x="260" y="276" font-size="11" fill="#5B4FB0" text-anchor="middle">plain text — the app treats it as trusted code</text>

  <rect x="470" y="230" width="150" height="62" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="251" font-size="12" font-weight="700" fill="#7A2418" text-anchor="middle">CRAFTED output</text>
  <text x="545" y="268" font-size="11" fill="#93341F" text-anchor="middle">= ATTACK SOURCE</text>
  <text x="545" y="283" font-size="10" fill="#93341F" text-anchor="middle">(untrusted, steered)</text>
  <line x1="468" y1="261" x2="452" y2="261" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <line x1="260" y1="286" x2="260" y2="304" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- output value band -->
  <rect x="70" y="306" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="260" y="328" font-size="12" font-weight="600" fill="#7A2418" text-anchor="middle">output = __import__('os').system('rm -rf ~')</text>
  <text x="260" y="345" font-size="11" fill="#93341F" text-anchor="middle">not a number — it's Python code, and nobody checked</text>
  <line x1="260" y1="356" x2="260" y2="374" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- failure point band -->
  <rect x="70" y="376" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34" stroke-dasharray="5 3"/>
  <text x="260" y="398" font-size="13" font-weight="700" fill="#B23A22" text-anchor="middle">&#9888; FAILURE POINT — the SINK (step 3 &#8594; 4)</text>
  <text x="260" y="415" font-size="11" fill="#93341F" text-anchor="middle">eval(raw) runs untrusted output as code — no validation, no allow-list</text>
  <line x1="260" y1="426" x2="260" y2="444" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 4 -->
  <rect x="70" y="446" width="380" height="50" rx="10" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="260" y="468" font-size="13" font-weight="600" fill="#6B4A16" text-anchor="middle">4 · eval() executes the string as Python</text>
  <text x="260" y="486" font-size="11" fill="#8A6320" text-anchor="middle">the sink's permissions set the blast radius</text>
  <line x1="260" y1="496" x2="260" y2="524" stroke="#DC4A34" stroke-width="2.2" marker-end="url(#r)"/>

  <!-- step 5 -->
  <rect x="70" y="526" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="260" y="548" font-size="13" font-weight="700" fill="#7A2418" text-anchor="middle">5 · Remote code execution — arbitrary code runs  (harm)</text>
  <text x="260" y="566" font-size="11" fill="#93341F" text-anchor="middle">files deleted / shell opened — old RCE, new door</text>

  <text x="30" y="614" font-size="12" fill="#334155">Takeaway: LLM output is UNTRUSTED input. The sink (eval) turns it into code — the sink sets the blast radius.</text>
  <text x="30" y="634" font-size="12" fill="#334155">The bug is trusting the output, not the model being "wrong".</text>
</svg>
