<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Insecure output handling defense in depth, top to bottom, showing where each guardrail stops or contains the attack">
  <rect x="0" y="0" width="640" height="720" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Insecure output handling — the solution (defense in depth)</text>
  <text x="30" y="54" font-size="13" fill="#475569">Same calculator; green = a guardrail placed where it stops or contains the attack.</text>

  <!-- 1 user -->
  <rect x="70" y="72" width="380" height="46" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="100" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1 · User asks the calculator a question</text>
  <line x1="260" y1="118" x2="260" y2="142" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 LLM emits, crafted output still possible -->
  <rect x="70" y="144" width="380" height="46" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="172" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">2 · LLM emits its reply  (crafted output still possible)</text>
  <rect x="470" y="140" width="150" height="52" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="162" font-size="11" font-weight="700" fill="#7A2418" text-anchor="middle">CRAFTED output</text>
  <text x="545" y="178" font-size="10" fill="#93341F" text-anchor="middle">still arrives</text>
  <line x1="468" y1="166" x2="452" y2="166" stroke="#DC4A34" stroke-width="2" marker-end="url(#g)"/>
  <line x1="260" y1="190" x2="260" y2="212" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 1 -->
  <rect x="70" y="214" width="380" height="70" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="236" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 1 · Never execute output  (PREVENT)</text>
  <text x="260" y="254" font-size="11" fill="#12735A" text-anchor="middle">drop eval() &#8594; ast.parse + allow-list of numbers &amp; operators;</text>
  <text x="260" y="268" font-size="11" fill="#12735A" text-anchor="middle">names / calls / __import__ are rejected, not run</text>
  <line x1="260" y1="284" x2="260" y2="306" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- DEFENSE 2 -->
  <rect x="70" y="308" width="380" height="70" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="330" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 2 · Validate &amp; encode for the sink  (PREVENT)</text>
  <text x="260" y="348" font-size="11" fill="#12735A" text-anchor="middle">schema/type-check the value; parameterize for SQL,</text>
  <text x="260" y="362" font-size="11" fill="#12735A" text-anchor="middle">encode for HTML — treat output as untrusted data</text>
  <line x1="260" y1="378" x2="260" y2="400" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- DEFENSE 3 -->
  <rect x="70" y="402" width="380" height="70" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="424" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 3 · Least-privilege sandbox  (CONTAIN)</text>
  <text x="260" y="442" font-size="11" fill="#12735A" text-anchor="middle">if a sink must run, run it with minimal perms,</text>
  <text x="260" y="456" font-size="11" fill="#12735A" text-anchor="middle">no creds / network, and audit-log every output</text>
  <line x1="260" y1="472" x2="260" y2="494" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- safe sink -->
  <rect x="70" y="496" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="518" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">Sink: safe_eval() parses arithmetic only</text>
  <text x="260" y="536" font-size="11" fill="#475569" text-anchor="middle">a valid "21 * 2" &#8594; 42; anything else raises</text>
  <line x1="260" y1="546" x2="260" y2="568" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- result -->
  <rect x="70" y="570" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#0F5C46"/>
  <text x="260" y="592" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">Result: malicious output rejected, not executed</text>
  <text x="260" y="610" font-size="11" fill="#334155" text-anchor="middle">__import__('os').system(...) raises ValueError — no RCE</text>

  <text x="30" y="654" font-size="12" fill="#334155">Layers 1&#8211;2 PREVENT (never exec, validate/encode); layer 3 CONTAINS the sink if code ever runs.</text>
  <text x="30" y="674" font-size="12" fill="#334155">Zero-trust the output: validate before use, parameterize before querying, encode before rendering.</text>
</svg>
