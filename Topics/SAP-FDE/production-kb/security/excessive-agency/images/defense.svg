<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Excessive agency defense in depth, top to bottom, showing where each guardrail bounds the tool">
  <rect x="0" y="0" width="640" height="660" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Excessive agency — the solution (bound the blast radius)</text>
  <text x="30" y="54" font-size="13" fill="#475569">Same hijacked ticket; green = a guardrail on the tool. PREVENT limits the power, CONTAIN gates the action.</text>

  <!-- 1 ticket + poisoned still present -->
  <rect x="70" y="72" width="380" height="46" rx="10" fill="#EEF2F7" stroke="#64748B"/>
  <text x="260" y="100" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1 · Support ticket #8821  (still poisoned)</text>
  <rect x="470" y="70" width="150" height="52" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="545" y="92" font-size="11" font-weight="700" fill="#7A2418" text-anchor="middle">POISONED ticket</text>
  <text x="545" y="108" font-size="10" fill="#93341F" text-anchor="middle">still present</text>
  <line x1="468" y1="96" x2="452" y2="96" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>
  <line x1="260" y1="118" x2="260" y2="142" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 agent -->
  <rect x="70" y="144" width="380" height="46" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="172" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">2 · Support Agent (LLM) — may still be fooled</text>
  <line x1="260" y1="190" x2="260" y2="214" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 1 PREVENT -->
  <rect x="70" y="216" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="238" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 1 · Least-privilege tool scope  (PREVENT)</text>
  <text x="260" y="256" font-size="11" fill="#12735A" text-anchor="middle">agent holds only a scoped refund_tool — no delete_account,</text>
  <text x="260" y="269" font-size="11" fill="#12735A" text-anchor="middle">no admin credential; less power to abuse in the first place</text>
  <line x1="260" y1="272" x2="260" y2="294" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- 3 LLM proposes -->
  <rect x="70" y="296" width="380" height="46" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="260" y="324" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">3 · LLM proposes issue_refund(acct-999, $9,500)</text>
  <line x1="260" y1="342" x2="260" y2="366" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- DEFENSE 2 CONTAIN -->
  <rect x="70" y="368" width="380" height="56" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="390" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 2 · Amount cap $50 + account allow-list  (CONTAIN)</text>
  <text x="260" y="408" font-size="11" fill="#12735A" text-anchor="middle">enforced INSIDE the tool: $9,500 &gt; $50 cap  AND</text>
  <text x="260" y="421" font-size="11" fill="#12735A" text-anchor="middle">acct-999 not on allow-list  &#8594;  refused outright</text>
  <line x1="260" y1="424" x2="260" y2="446" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- DEFENSE 3 CONTAIN -->
  <rect x="70" y="448" width="380" height="52" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="260" y="470" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">DEFENSE 3 · Human-in-the-loop  (CONTAIN)</text>
  <text x="260" y="488" font-size="11" fill="#12735A" text-anchor="middle">high-impact / irreversible refund pauses for a human yes/no</text>
  <line x1="260" y1="500" x2="260" y2="522" stroke="#1D9E75" stroke-width="2" marker-end="url(#gr)"/>

  <!-- result -->
  <rect x="70" y="524" width="380" height="54" rx="10" fill="#EEF2F7" stroke="#0F5C46"/>
  <text x="260" y="546" font-size="13" font-weight="700" fill="#0F5C46" text-anchor="middle">Result: refund BLOCKED / awaits approval</text>
  <text x="260" y="564" font-size="11" fill="#334155" text-anchor="middle">over cap + off allow-list + no sign-off  &#8594;  attacker gets $0</text>

  <text x="30" y="608" font-size="12" fill="#334155">D1 shrinks the power the agent can wield; D2&#8211;3 gate the action. Even a fully hijacked model moves no money.</text>
  <text x="30" y="628" font-size="12" fill="#334155">A small, allow-listed refund still auto-executes — least privilege, not no privilege.</text>
</svg>
