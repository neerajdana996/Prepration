<svg xmlns="http://www.w3.org/2000/svg" width="660" height="555" viewBox="0 0 660 555" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="OWASP Top 10 for LLM Applications (2025), grouped by where in the LLM lifecycle each risk occurs">
  <rect x="0" y="0" width="660" height="555" fill="#ffffff"/>

  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">OWASP Top 10 for LLM Apps (2025)</text>
  <text x="24" y="52" font-size="13" fill="#475569">The 10 risks grouped by <tspan font-weight="600" fill="#334155">where in the LLM lifecycle</tspan> they occur — input &#8594; build &#8594; output &#8594; run.</text>

  <!-- ============ LANE 1 · INPUT / PROMPT (purple) ============ -->
  <rect x="24" y="68" width="612" height="86" rx="12" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="38" y="88" font-size="14" font-weight="700" fill="#3C3489">INPUT / PROMPT</text>
  <text x="182" y="88" font-size="11" fill="#5B4FB0">what enters the model — user input &amp; the system prompt</text>

  <!-- LLM01 -->
  <rect x="36" y="98" width="188" height="46" rx="8" fill="#ffffff" stroke="#7C6FE0"/>
  <text x="48" y="117" font-size="12" font-weight="700" fill="#3C3489">LLM01</text>
  <text x="48" y="134" font-size="11.5" fill="#1F2937">Prompt Injection</text>
  <!-- LLM07 -->
  <rect x="236" y="98" width="188" height="46" rx="8" fill="#ffffff" stroke="#7C6FE0"/>
  <text x="248" y="117" font-size="12" font-weight="700" fill="#3C3489">LLM07</text>
  <text x="248" y="134" font-size="11.5" fill="#1F2937">System Prompt Leakage</text>

  <!-- ============ LANE 2 · DATA & MODEL (blue) ============ -->
  <rect x="24" y="166" width="612" height="86" rx="12" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="38" y="186" font-size="14" font-weight="700" fill="#1E4E79">DATA &amp; MODEL</text>
  <text x="168" y="186" font-size="11" fill="#3B6EA0">what the model is built from &amp; retrieves</text>

  <!-- LLM03 -->
  <rect x="36" y="196" width="188" height="46" rx="8" fill="#ffffff" stroke="#3B82C4"/>
  <text x="48" y="215" font-size="12" font-weight="700" fill="#1E4E79">LLM03</text>
  <text x="48" y="232" font-size="11.5" fill="#1F2937">Supply Chain</text>
  <!-- LLM04 -->
  <rect x="236" y="196" width="188" height="46" rx="8" fill="#ffffff" stroke="#3B82C4"/>
  <text x="248" y="215" font-size="12" font-weight="700" fill="#1E4E79">LLM04</text>
  <text x="248" y="232" font-size="11.5" fill="#1F2937">Data &amp; Model Poisoning</text>
  <!-- LLM08 -->
  <rect x="436" y="196" width="188" height="46" rx="8" fill="#ffffff" stroke="#3B82C4"/>
  <text x="448" y="215" font-size="12" font-weight="700" fill="#1E4E79">LLM08</text>
  <text x="448" y="232" font-size="11.5" fill="#1F2937">Vector &amp; Embedding Weak.</text>

  <!-- ============ LANE 3 · OUTPUT & ACTIONS (amber) ============ -->
  <rect x="24" y="264" width="612" height="144" rx="12" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="38" y="284" font-size="14" font-weight="700" fill="#6B4A16">OUTPUT &amp; ACTIONS</text>
  <text x="196" y="284" font-size="11" fill="#8A6320">what the model emits &amp; does downstream</text>

  <!-- LLM02 -->
  <rect x="36" y="294" width="188" height="46" rx="8" fill="#ffffff" stroke="#D89B4A"/>
  <text x="48" y="313" font-size="12" font-weight="700" fill="#6B4A16">LLM02</text>
  <text x="48" y="330" font-size="11.5" fill="#1F2937">Sensitive Info Disclosure</text>
  <!-- LLM05 -->
  <rect x="236" y="294" width="188" height="46" rx="8" fill="#ffffff" stroke="#D89B4A"/>
  <text x="248" y="313" font-size="12" font-weight="700" fill="#6B4A16">LLM05</text>
  <text x="248" y="330" font-size="11.5" fill="#1F2937">Improper Output Handling</text>
  <!-- LLM06 -->
  <rect x="436" y="294" width="188" height="46" rx="8" fill="#ffffff" stroke="#D89B4A"/>
  <text x="448" y="313" font-size="12" font-weight="700" fill="#6B4A16">LLM06</text>
  <text x="448" y="330" font-size="11.5" fill="#1F2937">Excessive Agency</text>
  <!-- LLM09 -->
  <rect x="36" y="352" width="188" height="46" rx="8" fill="#ffffff" stroke="#D89B4A"/>
  <text x="48" y="371" font-size="12" font-weight="700" fill="#6B4A16">LLM09</text>
  <text x="48" y="388" font-size="11.5" fill="#1F2937">Misinformation</text>

  <!-- ============ LANE 4 · INFRA & OPS (green) ============ -->
  <rect x="24" y="420" width="612" height="86" rx="12" fill="#E7F3EA" stroke="#4C9A6A"/>
  <text x="38" y="440" font-size="14" font-weight="700" fill="#245A38">INFRA &amp; OPS</text>
  <text x="160" y="440" font-size="11" fill="#3B7A54">how it is run — capacity &amp; cost</text>

  <!-- LLM10 -->
  <rect x="36" y="450" width="188" height="46" rx="8" fill="#ffffff" stroke="#4C9A6A"/>
  <text x="48" y="469" font-size="12" font-weight="700" fill="#245A38">LLM10</text>
  <text x="48" y="486" font-size="11.5" fill="#1F2937">Unbounded Consumption</text>

  <text x="24" y="534" font-size="12" fill="#334155">Takeaway: you can&#8217;t make the model un-foolable &#8212; harden each stage (least privilege, validate trust boundaries, gate irreversible actions, cap consumption).</text>
</svg>
