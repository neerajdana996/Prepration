<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Production agent stages and layers as a LangGraph pipeline">
  <rect x="0" y="0" width="700" height="660" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="700" fill="#0f172a">Production agent — stages &amp; layers (LangGraph)</text>
  <text x="30" y="54" font-size="12.5" fill="#475569">One request flows top-to-bottom. Each box = a graph node. Right tag = the concern/module it embodies.</text>

  <!-- 1 -->
  <rect x="40" y="74" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="230" y="96" font-size="13" font-weight="600" fill="#7A2418" text-anchor="middle">1 · input guardrail</text>
  <text x="230" y="113" font-size="11" fill="#93341F" text-anchor="middle">injection check + attach customer scope</text>
  <text x="440" y="103" font-size="11" fill="#64748B">SECURITY (M7)</text>
  <line x1="230" y1="124" x2="230" y2="146" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 -->
  <rect x="40" y="148" width="380" height="50" rx="10" fill="#EDE7FB" stroke="#7C6FE0"/>
  <text x="230" y="170" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">2 · route (supervisor)</text>
  <text x="230" y="187" font-size="11" fill="#5B4FB0" text-anchor="middle">classify: order / invoice / policy</text>
  <text x="440" y="177" font-size="11" fill="#64748B">AGENTS (M5)</text>
  <line x1="230" y1="198" x2="230" y2="220" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 3 -->
  <rect x="40" y="222" width="380" height="50" rx="10" fill="#E3F0FB" stroke="#3B82C4"/>
  <text x="230" y="244" font-size="13" font-weight="600" fill="#1E4E79" text-anchor="middle">3 · retrieve / fetch</text>
  <text x="230" y="261" font-size="11" fill="#3B6EA0" text-anchor="middle">tool/API for order+invoice · RAG for policy</text>
  <text x="440" y="245" font-size="11" fill="#64748B">RETRIEVAL (M3/M4)</text>
  <text x="440" y="261" font-size="11" fill="#DC4A34">+ access control</text>
  <line x1="230" y1="272" x2="230" y2="294" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 4 -->
  <rect x="40" y="296" width="380" height="50" rx="10" fill="#E4F6EE" stroke="#1D9E75"/>
  <text x="230" y="318" font-size="13" font-weight="600" fill="#0F5C46" text-anchor="middle">4 · generate (grounded)</text>
  <text x="230" y="335" font-size="11" fill="#12735A" text-anchor="middle">answer only from context + cite + "I don't know"</text>
  <text x="440" y="325" font-size="11" fill="#64748B">GROUNDING (M4)</text>
  <line x1="230" y1="346" x2="230" y2="368" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 5 -->
  <rect x="40" y="370" width="380" height="50" rx="10" fill="#FDF3DD" stroke="#D89B4A"/>
  <text x="230" y="392" font-size="13" font-weight="600" fill="#6B4A16" text-anchor="middle">5 · HITL gate</text>
  <text x="230" y="409" font-size="11" fill="#8A6320" text-anchor="middle">high-impact (refund)? → human approval</text>
  <text x="440" y="399" font-size="11" fill="#64748B">SAFETY (M5/M7)</text>
  <line x1="230" y1="420" x2="230" y2="442" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 6 -->
  <rect x="40" y="444" width="380" height="50" rx="10" fill="#FBE3DE" stroke="#DC4A34"/>
  <text x="230" y="466" font-size="13" font-weight="600" fill="#7A2418" text-anchor="middle">6 · output guardrail</text>
  <text x="230" y="483" font-size="11" fill="#93341F" text-anchor="middle">PII redaction + secret/safety check</text>
  <text x="440" y="473" font-size="11" fill="#64748B">SECURITY (M7)</text>
  <line x1="230" y1="494" x2="230" y2="516" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/>

  <!-- 7 -->
  <rect x="40" y="518" width="380" height="50" rx="10" fill="#EEF2F7" stroke="#0F5C46"/>
  <text x="230" y="540" font-size="13" font-weight="600" fill="#0F5C46" text-anchor="middle">7 · respond + trace</text>
  <text x="230" y="557" font-size="11" fill="#334155" text-anchor="middle">return answer; emit the full stage trace</text>
  <text x="440" y="547" font-size="11" fill="#64748B">OBSERVABILITY (M8)</text>

  <text x="30" y="608" font-size="12" fill="#334155">Cross-cutting: every stage appends a SPAN to state['trace'] — that's your observability view of one request.</text>
  <text x="30" y="628" font-size="12" fill="#334155">Access control scopes stage 3 to the customer; HITL (5) contains money actions; guardrails (1,6) bound injection + PII.</text>
</svg>
